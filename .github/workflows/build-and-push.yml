
name: DCE04 Build and Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - service-a
          - service-b

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JavaScript
        run: |
          node --check applications/${{ matrix.service }}/server.js

      # Temporary diagnostic to troubleshoot AWS OIDC authentication
      - name: Diagnose GitHub OIDC claims
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request
          import urllib.parse

          request_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          request_token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          separator = "&" if "?" in request_url else "?"
          url = request_url + separator + urllib.parse.urlencode({
              "audience": "sts.amazonaws.com"
          })

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer " + request_token
              }
          )

          with urllib.request.urlopen(request) as response:
              jwt = json.load(response)["value"]

          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          print("GitHub OIDC claims:")
          print("iss:", claims.get("iss"))
          print("aud:", claims.get("aud"))
          print("sub:", claims.get("sub"))
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::488510448462:role/dce04-github-actions-role
          aws-region: ap-southeast-2
          role-session-name: DCE04GitHubActions

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: v2
        run: |
          docker build \
            -t "$ECR_REGISTRY/dce04-$SERVICE:$IMAGE_TAG" \
            "./applications/$SERVICE"

          docker push "$ECR_REGISTRY/dce04-$SERVICE:$IMAGE_TAG"
